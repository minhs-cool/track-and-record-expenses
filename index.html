<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to do list</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div>
            <h1 id="title">Expenses tracker</h1>
            <h2>trak and expense</h2>
        </div>

        <form action="" id="form_data">
            <input class="input-box" type="text" name="myitem" placeholder="name expense">
            <input class="input-box" type="date" name="date">
            <input class="input-box" type="number" name="cost" placeholder="how costly is your expense">
            <label for="category">Choose a category:</label>
            <select name="category" id="category">
                <option value="Rent">Rent</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Food">Food</option>
                <option value="Bills">Bills</option>
                <option value="Others">Others</option>
            </select>
        </form>

        <div class="controls">
            <button type="button" id="btn" class="btn">Click me</button>
            <div>
                <button class="btn" id="clear-button">clear expenses</button>
            </div>
            <div class="filter-dropdown">
                <label for="filter">filter expenses by:</label>
                <select name="filter" id="filter">
                    <option value="Date">Date</option>
                    <option value="Cost">Price</option>
                </select>
            </div>
        </div>

        <div class="list_container">
            <table>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Date</th>
                        <th>Cost</th>
                        <th>Category</th>
                    </tr>
                </thead>
                <tbody id="table"></tbody>
            </table>
        </div>
    </div>

<script src="main.js"></script>
</body>
</html>
